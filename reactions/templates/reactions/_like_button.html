<span id="like-{{ target_model }}-{{ target_pk }}">
    {% if request.user.is_authenticated %}
    <form method="post"
          action="{% url 'reactions:toggle' target_app target_model target_pk %}"
          hx-post="{% url 'reactions:toggle' target_app target_model target_pk %}"
          hx-target="#like-{{ target_model }}-{{ target_pk }}"
          hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit"
            class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium transition {% if liked %}bg-slate-900 text-white hover:bg-slate-700{% else %}border border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50{% endif %}">
            <span>{% if liked %}{{ active_label|default:'Liked' }}{% else %}{{ label|default:'Like' }}{% endif %}</span>
            <span class="tabular-nums">{{ count }}</span>
        </button>
    </form>
    {% else %}
    <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 px-3 py-1 text-xs font-medium text-slate-400">
        <span>{{ label|default:'Like' }}</span>
        <span class="tabular-nums">{{ count }}</span>
    </span>
    {% endif %}
</span>
