<div class="flex flex-wrap items-center gap-x-6 gap-y-1 text-sm">
    <span class="font-bold text-text-primary">{{ post_count|default:0 }} posts</span>
    <a href="{% url 'accounts:followers' profile_user.username %}"
       class="font-bold text-text-primary hover:underline"
       data-profile-list-trigger="Followers"
       hx-get="{% url 'accounts:followers' profile_user.username %}"
       hx-target="#profile-list-modal-content" hx-swap="innerHTML">
        {{ profile_user.followers.count }} followers
    </a>
    <a href="{% url 'accounts:following' profile_user.username %}"
       class="font-bold text-text-primary hover:underline"
       data-profile-list-trigger="Following"
       hx-get="{% url 'accounts:following' profile_user.username %}"
       hx-target="#profile-list-modal-content" hx-swap="innerHTML">
        {{ profile_user.following.count }} following
    </a>
</div>
