{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-bold mb-6">Create an account</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="w-full rounded bg-slate-900 text-white py-2 text-sm">Sign up</button>
    </form>
    <div class="mt-4 text-sm">
        <a href="{% url 'login' %}" class="underline">Already have an account?</a>
    </div>
</div>
{% endblock %}
