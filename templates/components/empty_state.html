<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-5 py-10 text-center shadow-sm">
    <h3 class="text-xl font-semibold text-slate-900">{{ title }}</h3>
    {% if message %}
        <p class="mt-3 text-sm leading-6 text-slate-600">{{ message }}</p>
    {% endif %}
    {% if action_url %}
        <div class="mt-6">
            <a href="{% url action_url %}" class="inline-flex rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">
                {{ action_text|default:"Get started" }}
            </a>
        </div>
    {% endif %}
</div>
