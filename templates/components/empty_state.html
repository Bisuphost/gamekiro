<div class="glass-panel rounded-2xl border border-dashed border-border-subtle px-5 py-10 text-center">
    <h3 class="text-xl font-bold text-text-primary">{{ title }}</h3>
    {% if message %}
        <p class="mt-3 text-sm leading-6 text-text-secondary">{{ message }}</p>
    {% endif %}
    {% if action_url %}
        <div class="mt-6">
            <a href="{% url action_url %}" class="inline-flex rounded-lg bg-accent-start px-4 py-2 text-sm font-bold text-text-primary transition hover:brightness-110">
                {{ action_text|default:"Get started" }}
            </a>
        </div>
    {% endif %}
</div>
