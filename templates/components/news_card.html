<a href="{% url 'news:detail' article.slug %}"
   class="glass-panel flex flex-col gap-3 rounded-xl border border-border-subtle/60 p-4 transition duration-200 hover:-translate-y-0.5 hover:border-accent-end/40">
    {% if article.cover_image %}
    <img src="{{ article.cover_image.url }}" alt="{{ article.title }}" class="h-32 w-full rounded-lg object-cover">
    {% else %}
    <div class="h-32 w-full rounded-lg bg-surface-elevated"></div>
    {% endif %}
    <div>
        <p class="font-bold text-text-primary">{{ article.title }}</p>
        {% if article.summary %}
        <p class="mt-1 line-clamp-2 text-sm text-text-secondary">{{ article.summary }}</p>
        {% endif %}
        <p class="mt-2 text-xs text-text-secondary">
            {% if article.author %}{{ article.author.username }} &middot; {% endif %}{{ article.published_at|date:"M j, Y" }}
        </p>
    </div>
</a>
