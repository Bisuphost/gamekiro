<a href="{% url 'messaging:inbox' %}"
   class="flex items-center justify-between gap-2.5 rounded-lg px-2.5 py-2 text-sm transition hover:bg-surface hover:text-text-primary {% if request.resolver_match.app_name == 'messaging' %}bg-surface-elevated font-bold text-text-primary{% else %}text-text-secondary{% endif %}"
   hx-get="{% url 'messaging:unread-count' %}" hx-trigger="load, every 30s" hx-target="#{{ prefix }}-message-unread" hx-swap="innerHTML">

            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />

        Messages
    </span>
    <span id="{{ prefix }}-message-unread">{% include "messaging/_unread_count.html" %}</span>
</a>
