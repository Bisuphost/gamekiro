{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">404</p>
    <h1 class="mt-4 text-4xl font-bold tracking-tight text-slate-900">Page not found</h1>
    <p class="mt-4 text-base text-slate-600">
        The page you're looking for doesn't exist or may have been moved.
    </p>
    <div class="mt-8">
        <a href="{% url 'core:home' %}" class="inline-flex rounded bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700">
            Go home
        </a>
    </div>
</div>
{% endblock %}
