{% extends "auth_base.html" %}

{% block title %}Change password{% endblock %}
{% block heading %}Change your password{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {% include "_auth_form_fields.html" %}
    <button type="submit" class="w-full rounded-lg bg-accent-start py-2.5 text-sm font-bold text-text-primary transition hover:brightness-110">
        Change password
    </button>
</form>
{% endblock %}
