{% extends "auth_base.html" %}

{% block title %}Password changed{% endblock %}

{% block heading_block %}{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/15">
        <svg class="h-6 w-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    <h1 class="mb-1.5 text-xl font-bold text-text-primary">Password changed</h1>
    <p class="text-sm text-text-secondary">Your password was changed successfully.</p>
</div>
{% endblock %}
