{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-bold mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full rounded bg-slate-900 text-white py-2 text-sm">Log in</button>
    </form>
    <div class="mt-4 text-sm flex justify-between">
        <a href="{% url 'accounts:signup' %}" class="underline">Create an account</a>
        <a href="{% url 'password_reset' %}" class="underline">Forgot password?</a>
    </div>
</div>
{% endblock %}
