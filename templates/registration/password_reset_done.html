{% extends "auth_base.html" %}

{% block title %}Reset link sent{% endblock %}

{% block heading_block %}{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/15">
        <svg class="h-6 w-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    <h1 class="mb-1.5 text-xl font-bold text-text-primary">Check your email</h1>
    <p class="mb-6 text-sm text-text-secondary">If an account exists with that email, a reset link has been sent.</p>
    <a href="{% url 'login' %}" class="text-sm font-medium text-text-primary underline underline-offset-2 hover:text-accent-end">Back to log in</a>
</div>
{% endblock %}
