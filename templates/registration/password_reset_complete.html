{% extends "auth_base.html" %}

{% block title %}Password changed{% endblock %}

{% block heading_block %}{% endblock %}

{% block content %}
<div class="text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/15">
        <svg class="h-6 w-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    <h1 class="mb-1.5 text-xl font-bold text-text-primary">Password updated</h1>
    <p class="mb-6 text-sm text-text-secondary">Your password has been set. You can log in now.</p>
    <a href="{% url 'login' %}" class="inline-block w-full rounded-lg bg-accent-start py-2.5 text-sm font-bold text-text-primary transition hover:brightness-110">Log in</a>
</div>
{% endblock %}
