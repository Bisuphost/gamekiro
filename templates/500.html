{% extends "base.html" %}

{% block title %}Server error{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">500</p>
    <h1 class="mt-4 text-4xl font-bold tracking-tight text-slate-900">Something went wrong</h1>
    <p class="mt-4 text-base text-slate-600">
        We're having trouble processing your request. Please try again later.
    </p>
    <div class="mt-8">
        <a href="{% url 'core:home' %}" class="inline-flex rounded bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700">
            Go home
        </a>
    </div>
</div>
{% endblock %}
