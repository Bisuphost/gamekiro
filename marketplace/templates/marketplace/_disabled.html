{% extends "base.html" %}

{% block title %}Store Unavailable | GameKiro{% endblock %}

{% block content %}
<div class="glass-panel mx-auto max-w-lg rounded-2xl border border-dashed border-border-subtle px-5 py-10 text-center">
    <h1 class="text-xl font-bold text-text-primary">The store is temporarily unavailable</h1>
    <p class="mt-3 text-sm leading-6 text-text-secondary">
        {{ message|default:"We're doing some maintenance on the GameKiro store. Please check back soon." }}
    </p>
    <div class="mt-6">
        <a href="{% url 'core:home' %}" class="inline-flex rounded-lg bg-accent-start px-4 py-2 text-sm font-bold text-text-primary transition hover:brightness-110">
            Back to GameKiro
        </a>
    </div>
</div>
{% endblock %}
